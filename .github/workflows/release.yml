name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

jobs:
  release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          cmdline-tools-version: 'latest'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create keystore from secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > signing.keystore
          echo "KEYSTORE_PATH=signing.keystore" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: |
          if [ -f "signing.keystore" ]; then
            ./gradlew :app:assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/signing.keystore \
              -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
              --no-daemon
          else
            ./gradlew :app:assembleRelease --no-daemon
          fi

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Web Video Caster ${{ steps.version.outputs.VERSION }}
          body: |
            ## Web Video Caster ${{ steps.version.outputs.VERSION }}

            Free, ad-free Chromecast app for casting web videos to TV.

            ### Changes
            - See commit history for details

            ### Downloads
            - **Debug APK**: For testing (unsigned)
            - **Release APK**: Signed (if keystore configured)

            ### Installation
            1. Download APK
            2. Enable "Install from unknown sources" on Android
            3. Install and grant permissions
            4. Connect to same WiFi as Chromecast
            5. Browse videos and tap "Play on TV"
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}