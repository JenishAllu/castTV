# Relay Server Configuration
# Copy to application.local.conf for local overrides

ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
        host = ${?HOST}
    }
    application {
        modules = [ "com.instantbits.cast.relay.ApplicationKt.module" ]
    }
}

# Extraction settings
extraction {
    # Timeout for fetching pages (ms)
    fetch-timeout = 15000

    # Maximum page size to process (bytes)
    max-page-size = 10485760  # 10MB

    # User agent for requests
    user-agent = "Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36"

    # Enable/disable extraction strategies
    strategies {
        video-tags = true
        source-tags = true
        script-regex = true
        youtube = true
        vimeo = true
        meta-tags = true
        json-ld = true
    }
}

# Logging
logback {
    level = "INFO"
    level = ${?LOG_LEVEL}
}