<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free, ad-free web video caster for Chromecast">
    <meta name="theme-color" content="#121212">
    <title>Web Video Caster</title>
    <!-- Material 3 Web Components -->
    <link rel="stylesheet" href="https://unpkg.com/material-components-web@14.0.0/dist/material-components-web.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="styles.css">
    <!-- Chrome Cast Sender SDK -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>
    <div class="app">
        <!-- Top App Bar -->
        <header class="top-app-bar" role="banner">
            <div class="mdc-top-app-bar">
                <div class="mdc-top-app-bar__row">
                    <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-start">
                        <span class="mdc-top-app-bar__title">Web Video Caster</span>
                    </section>
                    <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-end" role="toolbar">
                        <button class="mdc-icon-button material-symbols-rounded cast-button" id="castButton" aria-label="Cast to TV" title="Cast to TV">
                            cast
                        </button>
                    </section>
                </div>
            </div>
        </header>

        <!-- URL Bar -->
        <div class="url-bar-container">
            <div class="mdc-text-field mdc-text-field--outlined mdc-text-field--with-leading-icon url-bar">
                <span class="mdc-text-field__leading-icon material-symbols-rounded" aria-hidden="true">search</span>
                <input type="url" class="mdc-text-field__input" id="urlInput" placeholder="Enter video URL or search..." autocomplete="off" spellcheck="false">
                <div class="mdc-notched-outline">
                    <div class="mdc-notched-outline__leading"></div>
                    <div class="mdc-notched-outline__notch"></div>
                    <div class="mdc-notched-outline__trailing"></div>
                </div>
            </div>
            <button class="mdc-button mdc-button--unelevated go-button" id="goButton">
                <span class="mdc-button__label">Go</span>
            </button>
        </div>

        <!-- Video Found Card (hidden by default) -->
        <div class="video-found-card mdc-card" id="videoFoundCard" hidden>
            <div class="mdc-card__primary-action">
                <div class="video-info">
                    <img class="video-thumbnail" id="videoThumbnail" alt="" src="">
                    <div class="video-details">
                        <h3 class="video-title" id="videoTitle"></h3>
                        <p class="video-source" id="videoSource"></p>
                    </div>
                </div>
                <button class="mdc-button mdc-button--filled play-on-tv-button" id="playOnTvButton">
                    <span class="mdc-button__icon material-symbols-rounded" aria-hidden="true">cast_connected</span>
                    <span class="mdc-button__label">Play on TV</span>
                </button>
            </div>
        </div>

        <!-- WebView Container -->
        <div class="webview-container">
            <iframe id="webview" class="webview" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads" allow="encrypted-media; picture-in-picture" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

        <!-- Cast Status Bar (shown when casting) -->
        <div class="cast-status-bar mdc-card" id="castStatusBar" hidden>
            <div class="cast-status-content">
                <div class="cast-status-info">
                    <span class="material-symbols-rounded cast-status-icon" id="castStatusIcon">cast_connected</span>
                    <span class="cast-status-text" id="castStatusText">Casting to <strong id="castDeviceName"></strong></span>
                </div>
                <div class="cast-controls">
                    <button class="mdc-icon-button material-symbols-rounded" id="castPlayPause" aria-label="Play/Pause" title="Play/Pause">pause</button>
                    <button class="mdc-icon-button material-symbols-rounded" id="castStop" aria-label="Stop Casting" title="Stop Casting">stop</button>
                </div>
            </div>
            <div class="cast-progress" id="castProgress" hidden>
                <input type="range" class="mdc-slider" id="castSeekBar" min="0" max="100" value="0" aria-label="Seek">
            </div>
        </div>

        <!-- Snackbar for notifications -->
        <div class="mdc-snackbar" id="snackbar" aria-live="polite" aria-atomic="true" aria-hidden="true">
            <div class="mdc-snackbar__surface" role="status">
                <div class="mdc-snackbar__label" id="snackbarLabel"></div>
                <div class="mdc-snackbar__actions">
                    <button type="button" class="mdc-button mdc-snackbar__action" id="snackbarAction"></button>
                    <button type="button" class="mdc-icon-button mdc-snackbar__dismiss" aria-label="Dismiss">
                        <span class="material-symbols-rounded">close</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/material-components-web@14.0.0/dist/material-components-web.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
